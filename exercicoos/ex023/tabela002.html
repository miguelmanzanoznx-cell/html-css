<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style> 
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }
        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }

        td,th{
            border: 1px solid black;
            padding: 10px;
        }

        thead > tr > th {
            position: sticky;
            top: 0;
            background-color: gray;
        }


        thead, tfoot {
            background-color: #dbdfe6;
            color: black;
        }
        
        tbody > tr:nth-child(2n) {
            background-color: lightgreen;
        }

        td.num {
            text-align: right;
        }
    </style>

</head>
<body>
    <h1>Uso de tabelas grandes</h1>

    <!-- 
    ANATOMIA PARA TABELAS GRANDES
    table = tabela
    CAPTION = legenda da tabela
     THEAD 
        TR,TD,TH
     TBODY
        TR,TD,TH
     TFOOT
        TR,TD,TH
    -->

    <table>
        <caption>Unidades federativas do Brasil por população</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th style="width: 50px;" scope="col">População</th>
                <th class="num">% da população</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sao Paulo</td>
                <td class="num">46 081 801</td>
                <td class="num">21,59%</td>
            </tr>

            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 393 441</td>
                <td class="num">10,02%</td>
            </tr>

            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 223 547</td>
                <td class="num">8,07%</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td class="num"><strong>84698789</strong></td>
                <td>39.68%</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
